name: youtube-autopilot

on:
  workflow_dispatch:
    inputs:
      sync_assets:
        description: 'Sincronizar ativos canônicos do Academ-IA antes de aplicar correções'
        required: true
        default: true
        type: boolean
      run_cover_fixes:
        description: 'Aplicar correções de capas técnicas mapeadas'
        required: true
        default: true
        type: boolean
      run_fronts_ab:
        description: 'Aplicar privatizações/visibilidade das frentes A e B'
        required: true
        default: true
        type: boolean
      run_module00:
        description: 'Publicar o vídeo premium do módulo 00'
        required: true
        default: true
        type: boolean
      privatize_legacy:
        description: 'Privatizar automaticamente cBhbg51peQk e txsJDc1oxps ao publicar o módulo 00'
        required: true
        default: true
        type: boolean
  workflow_run:
    workflows: ['youtube-token-rotate']
    types: [completed]

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sync_report: AcademIA/youtube/reports/youtube_repo_sync_2026-07-29.json
    steps:
      - name: Checkout MMN repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clone Academ-IA source repo
        if: ${{ github.event_name == 'workflow_run' || inputs.sync_assets }}
        env:
          DEPLOY_PAT: ${{ secrets.DEPLOY_PAT }}
          GHP_FALLBACK: ${{ secrets.GHP_FALLBACK }}
        run: |
          set -e
          TOKEN="${DEPLOY_PAT:-${GHP_FALLBACK:-}}"
          if [ -z "$TOKEN" ]; then
            echo 'missing_pat_for_cross_repo_clone' >&2
            exit 1
          fi
          rm -rf .tmp/Academ-IA
          mkdir -p .tmp
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/Nexus-HUB57/Academ-IA.git" .tmp/Academ-IA

      - name: Sync canonical assets from Academ-IA
        if: ${{ github.event_name == 'workflow_run' || inputs.sync_assets }}
        run: |
          mkdir -p AcademIA/youtube/reports
          python3 scripts/youtube/sync_academia_assets.py \
            --source-repo .tmp/Academ-IA \
            --target-root . \
            --report AcademIA/youtube/reports/youtube_repo_sync_2026-07-29.json

      - name: Upload sync report
        if: ${{ always() && (github.event_name == 'workflow_run' || inputs.sync_assets) }}
        uses: actions/upload-artifact@v4
        with:
          name: youtube-autopilot-sync-report
          path: AcademIA/youtube/reports/youtube_repo_sync_2026-07-29.json
          if-no-files-found: warn

  validate-oauth:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      oauth_valid: ${{ steps.read_report.outputs.oauth_valid }}
      oauth_error: ${{ steps.read_report.outputs.oauth_error }}
    steps:
      - name: Checkout MMN repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google client libs
        run: |
          python3 -m pip install --quiet google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Validate OAuth secret
        id: validate
        continue-on-error: true
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_OAUTH_TOKEN_JSON: ${{ secrets.YOUTUBE_OAUTH_TOKEN_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
        run: |
          mkdir -p AcademIA/youtube/reports
          python3 scripts/youtube/validate_youtube_credentials.py \
            --report AcademIA/youtube/reports/youtube_oauth_validation_2026-07-29.json

      - name: Read OAuth report
        id: read_report
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = Path('AcademIA/youtube/reports/youtube_oauth_validation_2026-07-29.json')
          data = json.loads(report.read_text(encoding='utf-8'))
          with open(Path.cwd() / Path('.github_output.tmp'), 'w', encoding='utf-8') as f:
              f.write(f"oauth_valid={'true' if data.get('oauth_valid') else 'false'}\n")
              f.write(f"oauth_error={str(data.get('error', ''))}\n")
          PY
          cat .github_output.tmp >> "$GITHUB_OUTPUT"

      - name: Upload OAuth report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-autopilot-oauth-report
          path: AcademIA/youtube/reports/youtube_oauth_validation_2026-07-29.json
          if-no-files-found: warn

  apply-fixes:
    needs: [preflight, validate-oauth]
    if: ${{ needs.validate-oauth.outputs.oauth_valid == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      REMOTE_APP: /var/www/oneverso/current
      VPS_HOST: '143.95.213.237'
      VPS_PORT: '22022'
      VPS_USER: 'root'
    steps:
      - name: Checkout MMN repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_GITHUB }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync automation package to VPS
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" \
            "mkdir -p $REMOTE_APP/scripts/youtube $REMOTE_APP/AcademIA/youtube/reports $REMOTE_APP/AcademIA/youtube/masters $REMOTE_APP/AcademIA/youtube/thumbnails $REMOTE_APP/AcademIA/youtube/thumbnails_yt $REMOTE_APP/AcademIA/youtube/descriptions $REMOTE_APP/secrets"
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" -o StrictHostKeyChecking=no \
            scripts/youtube/apply_channel_fixes.py \
            scripts/youtube/upload_module00_premium.py \
            "$VPS_USER@$VPS_HOST:$REMOTE_APP/scripts/youtube/"
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" -o StrictHostKeyChecking=no \
            AcademIA/youtube/youtube_cover_fix_actions_2026-07-28.json \
            AcademIA/youtube/youtube_fronts_A_B_visibility_actions_2026-07-28.json \
            "$VPS_USER@$VPS_HOST:$REMOTE_APP/AcademIA/youtube/"
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" -o StrictHostKeyChecking=no \
            AcademIA/youtube/masters/video-00-boas-vindas-a-academia-nexus-master.mp4 \
            "$VPS_USER@$VPS_HOST:$REMOTE_APP/AcademIA/youtube/masters/video-00-boas-vindas-a-academia-nexus-master.mp4"
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" -o StrictHostKeyChecking=no \
            AcademIA/youtube/descriptions/00-boas-vindas-a-academia-nexus.txt \
            "$VPS_USER@$VPS_HOST:$REMOTE_APP/AcademIA/youtube/descriptions/00-boas-vindas-a-academia-nexus.txt"
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" -o StrictHostKeyChecking=no \
            AcademIA/youtube/thumbnails_yt/*.jpg \
            "$VPS_USER@$VPS_HOST:$REMOTE_APP/AcademIA/youtube/thumbnails_yt/"
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" -o StrictHostKeyChecking=no \
            AcademIA/youtube/thumbnails/*.png \
            "$VPS_USER@$VPS_HOST:$REMOTE_APP/AcademIA/youtube/thumbnails/" || true

      - name: Materialize OAuth token on VPS
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_OAUTH_TOKEN_JSON: ${{ secrets.YOUTUBE_OAUTH_TOKEN_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
        run: |
          mkdir -p .tmp
          python3 - <<'PY'
          import os
          from pathlib import Path
          out = Path('.tmp/youtube_token.json')
          for name in ['YOUTUBE_TOKEN_JSON', 'YOUTUBE_OAUTH_TOKEN_JSON', 'GOOGLE_OAUTH_TOKEN_JSON']:
              value = os.environ.get(name, '').strip()
              if value:
                  out.write_text(value, encoding='utf-8')
                  print(f'token_materialized_from={name}')
                  break
          else:
              raise SystemExit('no_token_secret_available')
          PY
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" -o StrictHostKeyChecking=no \
            .tmp/youtube_token.json \
            "$VPS_USER@$VPS_HOST:$REMOTE_APP/secrets/youtube_token.json"
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" \
            "chmod 600 $REMOTE_APP/secrets/youtube_token.json"

      - name: Install Google client libs on VPS
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" \
            "cd $REMOTE_APP && python3 -c 'import googleapiclient, google.oauth2.credentials' >/dev/null 2>&1 || pip3 install --quiet --break-system-packages google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2"

      - name: Apply cover fixes on VPS
        if: ${{ github.event_name == 'workflow_run' || inputs.run_cover_fixes }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" \
            "cd $REMOTE_APP && python3 scripts/youtube/apply_channel_fixes.py AcademIA/youtube/youtube_cover_fix_actions_2026-07-28.json"
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" \
            "cp $REMOTE_APP/AcademIA/youtube/reports/youtube_channel_fix_results_2026-07-27.json $REMOTE_APP/AcademIA/youtube/reports/youtube_autopilot_cover_results_2026-07-29.json || true"

      - name: Apply fronts A/B fixes on VPS
        if: ${{ github.event_name == 'workflow_run' || inputs.run_fronts_ab }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" \
            "cd $REMOTE_APP && python3 scripts/youtube/apply_channel_fixes.py AcademIA/youtube/youtube_fronts_A_B_visibility_actions_2026-07-28.json"
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" \
            "cp $REMOTE_APP/AcademIA/youtube/reports/youtube_channel_fix_results_2026-07-27.json $REMOTE_APP/AcademIA/youtube/reports/youtube_autopilot_fronts_results_2026-07-29.json || true"

      - name: Upload premium module 00 on VPS
        if: ${{ github.event_name == 'workflow_run' || inputs.run_module00 }}
        run: |
          FLAG=""
          if [ "${{ github.event_name == 'workflow_run' && 'true' || inputs.privatize_legacy }}" = "true" ]; then FLAG="--privatize-legacy"; fi
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" \
            "cd $REMOTE_APP && python3 scripts/youtube/upload_module00_premium.py --privacy unlisted $FLAG"

      - name: Fetch reports from VPS
        if: always()
        run: |
          mkdir -p AcademIA/youtube/reports
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" -o StrictHostKeyChecking=no \
            "$VPS_USER@$VPS_HOST:$REMOTE_APP/AcademIA/youtube/reports/"*.json \
            AcademIA/youtube/reports/ || true

      - name: Upload autopilot report bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-autopilot-reports
          path: AcademIA/youtube/reports/*.json
          if-no-files-found: warn

  blocked-summary:
    needs: [validate-oauth]
    if: ${{ needs.validate-oauth.outputs.oauth_valid != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Emit blocked summary
        run: |
          echo "Autopilot bloqueado por OAuth inválido: ${{ needs.validate-oauth.outputs.oauth_error }}"
