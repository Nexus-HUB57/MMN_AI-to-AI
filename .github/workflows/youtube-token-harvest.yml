name: youtube-token-harvest

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/youtube-token-harvest.yml'
      - '.github/workflows/youtube-channel-fixes.yml'
  workflow_dispatch:

jobs:
  harvest-publish-and-dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      REMOTE_APP: /var/www/oneverso/current
      VPS_HOST: "143.95.213.237"
      VPS_PORT: "22022"
      VPS_USER: "root"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_GITHUB }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Harvest best YouTube token from VPS
        run: |
          mkdir -p .tmp
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" bash -se <<'REMOTE'
          set -e
          python3 - <<'PY'
          import json
          from pathlib import Path

          roots = [Path('/var/www/oneverso'), Path('/root'), Path('/home')]
          patterns = ['*youtube*token*.json', '*oauth*token*.json']
          selected_out = Path('/tmp/youtube_token_selected.json')
          summary_out = Path('/tmp/youtube_token_candidates_summary.json')

          def valid(d):
              return isinstance(d, dict) and d.get('refresh_token') and d.get('client_id') and d.get('client_secret')

          def norm_scopes(d):
              raw = d.get('scopes') or d.get('scope') or []
              if isinstance(raw, str):
                  return [s for s in raw.replace(',', ' ').split() if s]
              if isinstance(raw, list):
                  return [str(s) for s in raw if s]
              return []

          def score(scopes):
              s = ' '.join(scopes)
              pts = 0
              if 'https://www.googleapis.com/auth/youtube.force-ssl' in s:
                  pts += 100
              if 'https://www.googleapis.com/auth/youtube' in s:
                  pts += 80
              if 'https://www.googleapis.com/auth/youtube.upload' in s:
                  pts += 40
              if 'https://www.googleapis.com/auth/youtube.readonly' in s:
                  pts += 10
              return pts

          seen = set()
          candidates = []
          for root in roots:
              if not root.exists():
                  continue
              for pattern in patterns:
                  for path in root.rglob(pattern):
                      try:
                          rp = str(path.resolve())
                      except Exception:
                          rp = str(path)
                      if rp in seen:
                          continue
                      seen.add(rp)
                      try:
                          if not path.is_file() or path.stat().st_size > 2_000_000:
                              continue
                          data = json.loads(path.read_text(encoding='utf-8', errors='ignore'))
                      except Exception:
                          continue
                      if not valid(data):
                          continue
                      scopes = norm_scopes(data)
                      candidates.append({
                          'path': rp,
                          'size': path.stat().st_size,
                          'scopes': scopes,
                          'score': score(scopes),
                          'modified': int(path.stat().st_mtime),
                          'data': data,
                      })

          if not candidates:
              raise SystemExit('no_valid_youtube_token_candidates_found')

          candidates.sort(key=lambda c: (c['score'], c['modified'], c['size']), reverse=True)
          chosen = candidates[0]
          selected_out.write_text(json.dumps(chosen['data'], ensure_ascii=False), encoding='utf-8')
          safe_summary = {
              'total_candidates': len(candidates),
              'chosen': {
                  'path': chosen['path'],
                  'size': chosen['size'],
                  'scopes': chosen['scopes'],
                  'score': chosen['score'],
                  'modified': chosen['modified'],
              },
              'candidates': [
                  {
                      'path': c['path'],
                      'size': c['size'],
                      'scopes': c['scopes'],
                      'score': c['score'],
                      'modified': c['modified'],
                  }
                  for c in candidates
              ],
          }
          summary_out.write_text(json.dumps(safe_summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print(summary_out)
          print(selected_out)
          PY
          REMOTE
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST:/tmp/youtube_token_selected.json" .tmp/youtube_token_selected.json
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST:/tmp/youtube_token_candidates_summary.json" .tmp/youtube_token_candidates_summary.json
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" "rm -f /tmp/youtube_token_selected.json /tmp/youtube_token_candidates_summary.json"

      - name: Validate harvested token locally
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('.tmp/youtube_token_selected.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          missing = [k for k in ('refresh_token', 'client_id', 'client_secret') if not d.get(k)]
          if missing:
              raise SystemExit('missing_keys:' + ','.join(missing))
          print('token_valid')
          PY

      - name: Publish harvested token to repo secrets
        env:
          DEPLOY_PAT: ${{ secrets.DEPLOY_PAT }}
          GHP_FALLBACK: ${{ secrets.GHP_FALLBACK }}
        run: |
          export GH_TOKEN="${DEPLOY_PAT:-${GHP_FALLBACK:-}}"
          if [ -z "$GH_TOKEN" ]; then
            echo "No PAT available to publish secrets" >&2
            exit 1
          fi
          gh secret set YOUTUBE_TOKEN_JSON -R Nexus-HUB57/MMN_AI-to-AI < .tmp/youtube_token_selected.json
          gh secret set YOUTUBE_OAUTH_TOKEN_JSON -R Nexus-HUB57/MMN_AI-to-AI < .tmp/youtube_token_selected.json
          gh secret set GOOGLE_OAUTH_TOKEN_JSON -R Nexus-HUB57/MMN_AI-to-AI < .tmp/youtube_token_selected.json

      - name: Upload safe harvest report
        uses: actions/upload-artifact@v4
        with:
          name: youtube-token-harvest
          path: .tmp/youtube_token_candidates_summary.json
          if-no-files-found: error

      - name: Dispatch channel fix workflow
        env:
          DEPLOY_PAT: ${{ secrets.DEPLOY_PAT }}
          GHP_FALLBACK: ${{ secrets.GHP_FALLBACK }}
        run: |
          export GH_TOKEN="${DEPLOY_PAT:-${GHP_FALLBACK:-}}"
          if [ -z "$GH_TOKEN" ]; then
            echo "No PAT available to dispatch workflow" >&2
            exit 1
          fi
          gh workflow run youtube-channel-fixes.yml -R Nexus-HUB57/MMN_AI-to-AI
