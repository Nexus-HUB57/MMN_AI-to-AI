# =============================================================================
# VPS MP Secret Rotate — grava MERCADO_PAGO_WEBHOOK_SECRET do repo no .env do VPS,
# respeitando o flag imutavel, e reinicia o mmn-api para carregar em memoria.
# =============================================================================
# Sequencia atomica:
#   1) chattr -i .env  (destrava)
#   2) grep -v 'MERCADO_PAGO_WEBHOOK_SECRET=' .env > .env.new && append canonical value
#   3) mv .env.new .env
#   4) chattr +i .env  (retrava)
#   5) pm2 restart mmn-api --update-env
#   6) pos-validacao: compara sha256(runtime) == sha256(repo) via /proc/<pid>/environ
#
# Nao imprime o valor do segredo. So imprime hashes e tamanhos.

name: vps-mp-secret-rotate
on:
  workflow_dispatch:

concurrency:
  group: vps-mp-secret-rotate
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Compute repo-secret hash
        env:
          MP_SECRET: ${{ secrets.MERCADO_PAGO_WEBHOOK_SECRET }}
        run: |
          if [ -z "${MP_SECRET:-}" ]; then
            echo "::error::MERCADO_PAGO_WEBHOOK_SECRET vazio no repo"
            exit 1
          fi
          h=$(printf '%s' "$MP_SECRET" | sha256sum | awk '{print $1}')
          echo "repo_secret_sha256=${h} len=${#MP_SECRET}"
          echo "$h" > /tmp/repo_secret_sha256

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_GITHUB }}

      - name: Trust host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22022 -H 143.95.213.237 >> ~/.ssh/known_hosts

      - name: Push canonical MP secret into .env (respect chattr +i)
        env:
          MP_SECRET: ${{ secrets.MERCADO_PAGO_WEBHOOK_SECRET }}
        run: |
          # transporta o valor via base64 para nao vazar em log e permitir chars especiais
          MP_B64=$(printf '%s' "$MP_SECRET" | base64 -w0)
          REPO_HASH=$(cat /tmp/repo_secret_sha256)
          ssh -p 22022 root@143.95.213.237 MP_B64="$MP_B64" REPO_HASH="$REPO_HASH" 'bash -s' <<'REMOTE'
          set +e
          BASE=/var/www/oneverso/current
          cd "$BASE"

          echo "=== BEFORE: lsattr .env ==="
          lsattr .env 2>&1

          echo "=== destrava .env ==="
          chattr -i .env 2>&1 || true
          lsattr .env 2>&1

          echo "=== hash da linha atual (sem imprimir valor) ==="
          OLD=$(grep -E '^MERCADO_PAGO_WEBHOOK_SECRET=' .env | head -1 | sed 's/^MERCADO_PAGO_WEBHOOK_SECRET=//' | tr -d '"')
          if [ -n "$OLD" ]; then
            echo "old_secret_sha256=$(printf '%s' "$OLD" | sha256sum | awk '{print $1}') len=${#OLD}"
          else
            echo "no_previous_MERCADO_PAGO_WEBHOOK_SECRET_line"
          fi

          echo "=== reescreve .env sem a linha antiga do segredo ==="
          grep -v '^MERCADO_PAGO_WEBHOOK_SECRET=' .env > .env.new || true
          # decodifica o valor a partir da variavel de ambiente do SSH
          NEW_VAL=$(printf '%s' "$MP_B64" | base64 -d)
          # escrita sem imprimir o segredo
          printf 'MERCADO_PAGO_WEBHOOK_SECRET=%s\n' "$NEW_VAL" >> .env.new
          echo "new_secret_sha256=$(printf '%s' "$NEW_VAL" | sha256sum | awk '{print $1}') len=${#NEW_VAL}"
          echo "expected_repo_sha256=$REPO_HASH"

          mv .env.new .env
          chown root:root .env
          chmod 600 .env

          echo "=== retrava .env ==="
          chattr +i .env 2>&1 || true
          lsattr .env 2>&1

          echo "=== pm2 restart mmn-api --update-env ==="
          pm2 restart mmn-api --update-env 2>&1 | tail -20
          sleep 6
          pm2 save 2>&1 | tail -3

          echo "=== pos: hash do segredo em memoria ==="
          PID=$(pm2 jlist 2>/dev/null | python3 -c 'import sys,json; [print(p["pid"]) for p in json.load(sys.stdin) if p["name"]=="mmn-api" and p.get("pid")]' 2>/dev/null | head -1)
          echo "mmn-api pid=$PID"
          if [ -n "$PID" ] && [ -r "/proc/$PID/environ" ]; then
            RUN=$(tr '\0' '\n' < /proc/$PID/environ | awk -F= '/^MERCADO_PAGO_WEBHOOK_SECRET=/{print substr($0,index($0,"=")+1)}')
            if [ -n "$RUN" ]; then
              RH=$(printf '%s' "$RUN" | sha256sum | awk '{print $1}')
              echo "runtime_secret_sha256=$RH len=${#RUN}"
              [ "$RH" = "$REPO_HASH" ] && echo "MATCH_SECRETS_RUNTIME_OK" || echo "MISMATCH_SECRETS_RUNTIME"
            else
              echo "MERCADO_PAGO_WEBHOOK_SECRET ausente no environ pos-restart"
            fi
          fi

          echo "=== local health ==="
          curl -sS -m 6 http://127.0.0.1:3001/api/health || true
          echo
          echo "=== END ==="
          REMOTE

      - name: Re-run smoke webhook (signed)
        env:
          MP_SECRET: ${{ secrets.MERCADO_PAGO_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          TS=$(date +%s)
          PAYMENT_ID="smoke2-$(date +%s)"
          BODY=$(printf '{"action":"payment.updated","api_version":"v1","data":{"id":"%s"},"date_created":"%s","id":%s,"live_mode":false,"type":"payment","user_id":"1"}' \
            "$PAYMENT_ID" "$(date -u +%FT%TZ)" "$TS")
          REQ_ID="smoke2-$(uuidgen 2>/dev/null || echo $RANDOM$RANDOM)"
          MANIFEST=$(printf 'id:%s;request-id:%s;ts:%s;' "$PAYMENT_ID" "$REQ_ID" "$TS")
          SIG=$(printf '%s' "$MANIFEST" | openssl dgst -sha256 -hmac "$MP_SECRET" -hex | awk '{print $2}')
          echo "sending smoke2 payment_id=$PAYMENT_ID req_id=$REQ_ID ts=$TS"
          HTTP_CODE=$(curl -sS -o /tmp/mp_resp.txt -w '%{http_code}' -m 20 \
            -X POST -H "Content-Type: application/json" \
            -H "x-signature: ts=${TS},v1=${SIG}" \
            -H "x-request-id: ${REQ_ID}" \
            --data "$BODY" \
            "https://oneverso.com.br/api/webhooks/mercadopago" || echo 000)
          echo "http_code=$HTTP_CODE"
          echo "response_body:"; cat /tmp/mp_resp.txt || true

      - name: Pull pm2 logs (aceito vs rejeitado)
        run: |
          ssh -p 22022 root@143.95.213.237 'bash -s' <<'REMOTE'
          echo "=== pm2 logs mmn-api (last 60) filtrado ==="
          pm2 logs mmn-api --lines 60 --nostream 2>&1 | tail -120 | grep -iE 'mp-webhook|hmac|signature|smoke2|conciliad|reject|rejeitado|accepted|payment' | head -60
          echo "=== END ==="
          REMOTE
