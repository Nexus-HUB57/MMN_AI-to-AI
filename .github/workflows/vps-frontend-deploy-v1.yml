# =============================================================================
# VPS Frontend Deploy v1 — puxa origin/main no VPS, roda build do frontend
# (vite), publica dist para o backend Express servir estatico, e recarrega
# o mmn-api no PM2 preservando o secret MP injetado pelo v7.
# =============================================================================

name: vps-frontend-deploy-v1
on:
  workflow_dispatch:

concurrency:
  group: vps-frontend-deploy-v1
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_GITHUB }}

      - name: Trust host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22022 -H 143.95.213.237 >> ~/.ssh/known_hosts

      - name: Pull + build frontend + reload mmn-api
        env:
          MP_SECRET: ${{ secrets.MERCADO_PAGO_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          MP_B64=$(printf '%s' "$MP_SECRET" | base64 -w0)
          ssh -p 22022 root@143.95.213.237 MP_B64="$MP_B64" 'bash -s' <<'REMOTE'
          set -euo pipefail
          BASE=/var/www/oneverso/current
          cd "$BASE"

          echo "=== git pull origin main ==="
          git fetch origin main
          git reset --hard origin/main
          NEW_SHA=$(git rev-parse HEAD)
          echo "commit_now=$NEW_SHA"
          echo "$NEW_SHA" > backend/.git-commit

          echo
          echo "=== install workspaces (backend + frontend) ==="
          npm run install:deploy 2>&1 | tail -5

          echo
          echo "=== build frontend (vite) ==="
          npm run build:frontend 2>&1 | tail -20
          ls -lh frontend/dist/index.html
          FRONT_HASH=$(sha256sum frontend/dist/index.html | awk '{print $1}')
          echo "frontend_index_hash=$FRONT_HASH"

          echo
          echo "=== ensure backend can serve frontend dist ==="
          # backend/src/index.ts ja serve frontend/dist quando presente.
          # Aqui apenas garantimos que os assets estao no caminho esperado.
          ls -la frontend/dist | head -5

          echo
          echo "=== reload mmn-api mantendo secret MP ==="
          NEW_VAL=$(printf '%s' "$MP_B64" | base64 -d)
          [ -n "$NEW_VAL" ] || { echo "::error::MP secret vazio"; exit 1; }
          # Recarrega apenas o mmn-api (workers seguem rodando) e reinjeta o env.
          MERCADO_PAGO_WEBHOOK_SECRET="$NEW_VAL" COMMIT_SHA="$NEW_SHA" \
            pm2 restart mmn-api --update-env
          sleep 8
          pm2 jlist > /tmp/pm2.jlist.json
          python3 -c "import json; arr=json.load(open('/tmp/pm2.jlist.json')); [print({'name':p.get('name'),'pid':p.get('pid'),'status':(p.get('pm2_env') or {}).get('status'),'restart':(p.get('pm2_env') or {}).get('restart_time')}) for p in arr if p.get('name')=='mmn-api']"

          PID=$(python3 -c "import json; arr=json.load(open('/tmp/pm2.jlist.json')); print(next((p['pid'] for p in arr if p.get('name')=='mmn-api' and p.get('pid')), ''))")
          [ -n "$PID" ] || { echo "::error::pid indisponivel apos restart"; exit 1; }
          RUN_VAL=$(tr '\0' '\n' < /proc/$PID/environ | awk -F= '/^MERCADO_PAGO_WEBHOOK_SECRET=/{print substr($0,index($0,"=")+1)}')
          [ -n "$RUN_VAL" ] || { echo "::error::runtime env sem MERCADO_PAGO_WEBHOOK_SECRET apos restart"; exit 1; }
          echo "runtime_mp_secret_present=1 pid=$PID"

          echo
          echo "=== health check publico ==="
          curl -fsS https://oneverso.com.br/api/health | head -c 400; echo
          curl -fsS https://oneverso.com.br/api/health/pix | head -c 400; echo

          echo
          echo "=== verificar bundle publico contem novo hash ==="
          # Confere que o bundle publicado bate com o dist local.
          PUB_HTML=$(curl -fsS https://oneverso.com.br/ | sha256sum | awk '{print $1}' || true)
          echo "public_index_hash=$PUB_HTML local_index_hash=$FRONT_HASH"

          echo "FRONTEND_DEPLOY_OK commit=$NEW_SHA"
          REMOTE
