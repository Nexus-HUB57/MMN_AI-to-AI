name: emergency-nginx-fix-v2
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_GITHUB }}

      - name: Trust host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22022 -H 143.95.213.237 >> ~/.ssh/known_hosts

      - name: Read current config and fix Nginx
        run: |
          ssh -p 22022 root@143.95.213.237 'bash -s' <<'REMOTE'
          set -e

          echo "=== STEP 1: Read current oneverso nginx config ==="
          cat /etc/nginx/sites-available/oneverso.com.br.conf 2>/dev/null || echo "No config yet"
          echo
          echo "=== Current sites-enabled ==="
          ls -la /etc/nginx/sites-enabled/ 2>&1
          echo
          echo "=== Let us Encrypt certs ==="
          ls -la /etc/letsencrypt/live/oneverso.com.br/ 2>&1 || echo "No LE certs"
          echo
          echo "=== Frontend dist check ==="
          ls /var/www/oneverso/current/frontend/dist/index.html 2>/dev/null && echo "dist: OK" || echo "dist: MISSING"
          ls /var/www/oneverso/public/index.html 2>/dev/null && echo "public: OK" || echo "public: MISSING"

          echo
          echo "=== STEP 2: Ensure public symlink ==="
          if [ ! -L /var/www/oneverso/public ] && [ ! -d /var/www/oneverso/public ]; then
            mkdir -p /var/www/oneverso
            ln -sf /var/www/oneverso/current/frontend/dist /var/www/oneverso/public
            echo "Created symlink"
          elif [ -L /var/www/oneverso/public ]; then
            current_target=$(readlink /var/www/oneverso/public)
            echo "Symlink exists: -> $current_target"
            if [ "$current_target" != "/var/www/oneverso/current/frontend/dist" ]; then
              ln -sfn /var/www/oneverso/current/frontend/dist /var/www/oneverso/public
              echo "Updated symlink"
            fi
          else
            echo "public is a real dir, not symlink"
          fi

          echo
          echo "=== STEP 3: Write correct nginx config with LE SSL ==="
          cat > /etc/nginx/sites-available/oneverso.com.br.conf << 'NGINXCONF'
          # HTTP -> redirect to HTTPS
          server {
            listen 80;
            listen [::]:80;
            server_name oneverso.com.br www.oneverso.com.br;

            location /.well-known/acme-challenge/ {
              root /var/www/oneverso/public;
            }

            location / {
              return 301 https://$host$request_uri;
            }
          }

          # HTTPS
          server {
            listen 443 ssl http2;
            listen [::]:443 ssl http2;
            server_name oneverso.com.br www.oneverso.com.br;

            ssl_certificate /etc/letsencrypt/live/oneverso.com.br/fullchain.pem;
            ssl_certificate_key /etc/letsencrypt/live/oneverso.com.br/privkey.pem;
            include /etc/letsencrypt/options-ssl-nginx.conf;

            root /var/www/oneverso/public;
            index index.html;

            client_max_body_size 25M;

            location / {
              try_files $uri /index.html;
            }

            location /api/ {
              proxy_pass http://127.0.0.1:3001;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_read_timeout 300s;
              proxy_send_timeout 300s;
            }

            location /trpc/ {
              proxy_pass http://127.0.0.1:3001;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_read_timeout 300s;
              proxy_send_timeout 300s;
            }

            location /health {
              proxy_pass http://127.0.0.1:3001/api/health;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
            }

            access_log /var/log/nginx/oneverso-access.log;
            error_log /var/log/nginx/oneverso-error.log warn;
          }
          NGINXCONF

          echo "Config written"

          echo
          echo "=== STEP 4: Enable site ==="
          ln -sf /etc/nginx/sites-available/oneverso.com.br.conf /etc/nginx/sites-enabled/oneverso.com.br.conf

          echo
          echo "=== STEP 5: Test nginx ==="
          nginx -t 2>&1

          echo
          echo "=== STEP 6: Reload nginx ==="
          systemctl reload nginx 2>&1
          echo "Nginx reloaded OK"

          echo
          echo "=== STEP 7: Verify ==="
          sleep 2
          echo "Local API health:"
          curl -s http://127.0.0.1:3001/api/health
          echo
          echo "HTTP test (Host header):"
          curl -s -H "Host: oneverso.com.br" -o /dev/null -w "HTTP %{http_code} Size %{size_download}b\n" http://127.0.0.1/ 2>&1
          echo "HTTPS test (external):"
          curl -sk -o /dev/null -w "HTTP %{http_code} Size %{size_download}b Time %{time_total}s\n" https://oneverso.com.br/ --max-time 15 2>&1
          echo "HTTPS API health:"
          curl -sk --max-time 15 https://oneverso.com.br/api/health 2>&1
          echo
          echo "HTTPS API health/pix:"
          curl -sk --max-time 15 https://oneverso.com.br/api/health/pix 2>&1
          echo
          echo "=== DONE ==="
          REMOTE
