# =============================================================================
# Nexus Affil'IA'te — Deploy production via GitHub Actions (Deploy Key + SSH)
# =============================================================================
# CEO-012: Fixed trigger (ain] -> [main]), added .env protection in rsync

name: Deploy production
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install workspaces
        run: |
          npm install --workspace backend --workspace frontend \
            --legacy-peer-deps --no-audit --no-fund

      - name: Build backend
        run: npm --workspace backend run build:production

      - name: Build frontend
        run: NODE_OPTIONS=--max-old-space-size=4096 npm --workspace frontend run build

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_GITHUB }}

      - name: Trust host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22022 -H 143.95.213.237 >> ~/.ssh/known_hosts

      - name: Sync build to server
        run: |
          rsync -az \
            --exclude='.env' \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='database' \
            -e "ssh -p 22022" \
            ./ root@143.95.213.237:/var/www/oneverso/current/

      - name: Apply pending migrations
        env:
          DEPLOY_DATABASE_URL: ${{ secrets.DEPLOY_DATABASE_URL }}
          MARKETPLACE_PIX_KEY: ${{ secrets.MARKETPLACE_PIX_KEY }}
          MARKETPLACE_PIX_RECEIVER_NAME: ${{ secrets.MARKETPLACE_PIX_RECEIVER_NAME }}
          MARKETPLACE_PIX_RECEIVER_CITY: ${{ secrets.MARKETPLACE_PIX_RECEIVER_CITY }}
          MERCADO_PAGO_ACCESS_TOKEN: ${{ secrets.MERCADO_PAGO_ACCESS_TOKEN }}
          MERCADO_PAGO_PUBLIC_KEY: ${{ secrets.MERCADO_PAGO_PUBLIC_KEY }}
          MERCADO_PAGO_CLIENT_ID: ${{ secrets.MERCADO_PAGO_CLIENT_ID }}
          MERCADO_PAGO_CLIENT_SECRET: ${{ secrets.MERCADO_PAGO_CLIENT_SECRET }}
          MERCADO_PAGO_WEBHOOK_SECRET: ${{ secrets.MERCADO_PAGO_WEBHOOK_SECRET }}
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
        run: |
          PIX_KEY_B64=$(printf '%s' "$MARKETPLACE_PIX_KEY" | base64 -w0)
          PIX_NAME_B64=$(printf '%s' "$MARKETPLACE_PIX_RECEIVER_NAME" | base64 -w0)
          PIX_CITY_B64=$(printf '%s' "$MARKETPLACE_PIX_RECEIVER_CITY" | base64 -w0)
          MP_TOKEN_B64=$(printf '%s' "$MERCADO_PAGO_ACCESS_TOKEN" | base64 -w0)
          MP_PUBKEY_B64=$(printf '%s' "$MERCADO_PAGO_PUBLIC_KEY" | base64 -w0)
          MP_CID_B64=$(printf '%s' "$MERCADO_PAGO_CLIENT_ID" | base64 -w0)
          MP_CSECRET_B64=$(printf '%s' "$MERCADO_PAGO_CLIENT_SECRET" | base64 -w0)
          MP_WSECRET_B64=$(printf '%s' "$MERCADO_PAGO_WEBHOOK_SECRET" | base64 -w0)
          ssh -p 22022 root@143.95.213.237 "cd /var/www/oneverso/current && \
            [ -f .env ] || : > .env && \
            printf '%s\n' \
              \"MARKETPLACE_PIX_KEY=\$(printf '%s' '${PIX_KEY_B64}' | base64 -d)\" \
              \"MARKETPLACE_PIX_RECEIVER_NAME=\$(printf '%s' '${PIX_NAME_B64}' | base64 -d)\" \
              \"MARKETPLACE_PIX_RECEIVER_CITY=\$(printf '%s' '${PIX_CITY_B64}' | base64 -d)\" \
              \"MERCADO_PAGO_ACCESS_TOKEN=\$(printf '%s' '${MP_TOKEN_B64}' | base64 -d)\" \
              \"MERCADO_PAGO_PUBLIC_KEY=\$(printf '%s' '${MP_PUBKEY_B64}' | base64 -d)\" \
              \"MERCADO_PAGO_CLIENT_ID=\$(printf '%s' '${MP_CID_B64}' | base64 -d)\" \
              \"MERCADO_PAGO_CLIENT_SECRET=\$(printf '%s' '${MP_CSECRET_B64}' | base64 -d)\" \
              \"MERCADO_PAGO_WEBHOOK_SECRET=\$(printf '%s' '${MP_WSECRET_B64}' | base64 -d)\" \
              \"COMMIT_SHA=${{ github.sha }}\" >> .env && \
            printf '%s' '${{ github.sha }}' > .git-commit && \
            if [ -f .env ]; then set -a; . ./.env; set +a; fi && \
            DB_URL=\${DATABASE_URL:-\${DEPLOY_DATABASE_URL:-}} && \
            if [ -n \"\$DB_URL\" ]; then \
              for f in database/migrations/*.sql; do \
                echo \"Applying \$f ...\" | head -1; \
                psql \"\$DB_URL\" -v ON_ERROR_STOP=1 -f \"\$f\" 2>&1 | tail -3; \
              done; \
            else \
              echo 'WARNING: DATABASE_URL not available, skipping migrations'; \
            fi && \
            pm2 restart mmn-api --update-env 2>/dev/null || pm2 start ecosystem.config.js --env production && \
            pm2 save 2>/dev/null || true"

      - name: Healthcheck
        run: |
          sleep 8
          for path in /api/health /api/health/pix; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -m 20 "https://oneverso.com.br${path}" || echo 000)
            echo "  $path -> HTTP $code"
          done
