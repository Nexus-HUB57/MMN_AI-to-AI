name: youtube-thumb04-retry

on:
  workflow_dispatch:

jobs:
  apply-thumb04:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      REMOTE_APP: /var/www/oneverso/current
      VPS_HOST: "143.95.213.237"
      VPS_PORT: "22022"
      VPS_USER: "root"
      ACTIONS_FILE: AcademIA/youtube/youtube_channel_fix_actions_thumb04_retry_2026-07-27.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_GITHUB }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync retry script and actions to VPS
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" \
            "mkdir -p $REMOTE_APP/scripts/youtube $REMOTE_APP/AcademIA/youtube $REMOTE_APP/AcademIA/youtube/reports $REMOTE_APP/AcademIA/youtube/thumbnails_yt"
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" -o StrictHostKeyChecking=no \
            scripts/youtube/apply_channel_fixes.py \
            "$VPS_USER@$VPS_HOST:$REMOTE_APP/scripts/youtube/apply_channel_fixes.py"
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" -o StrictHostKeyChecking=no \
            AcademIA/youtube/youtube_channel_fix_actions_thumb04_retry_2026-07-27.json \
            "$VPS_USER@$VPS_HOST:$REMOTE_APP/AcademIA/youtube/youtube_channel_fix_actions_thumb04_retry_2026-07-27.json"
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" -o StrictHostKeyChecking=no \
            AcademIA/youtube/thumbnails_yt/04-construindo-seu-primeiro-agente-em-4-minutos.jpg \
            "$VPS_USER@$VPS_HOST:$REMOTE_APP/AcademIA/youtube/thumbnails_yt/04-construindo-seu-primeiro-agente-em-4-minutos.jpg"

      - name: Materialize token secret on VPS
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_OAUTH_TOKEN_JSON: ${{ secrets.YOUTUBE_OAUTH_TOKEN_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
        run: |
          mkdir -p .tmp
          python3 - <<'PY'
          import os
          from pathlib import Path
          out = Path('.tmp/youtube_token.json')
          for name in ['YOUTUBE_TOKEN_JSON', 'YOUTUBE_OAUTH_TOKEN_JSON', 'GOOGLE_OAUTH_TOKEN_JSON']:
              value = os.environ.get(name, '').strip()
              if value:
                  out.write_text(value, encoding='utf-8')
                  print(f'token_materialized_from={name}')
                  break
          else:
              raise SystemExit('no_token_secret_available')
          PY
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" -o StrictHostKeyChecking=no \
            .tmp/youtube_token.json \
            "$VPS_USER@$VPS_HOST:$REMOTE_APP/secrets/youtube_token.json"
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" \
            "chmod 600 $REMOTE_APP/secrets/youtube_token.json"
          rm -f .tmp/youtube_token.json

      - name: Apply thumb04 retry on VPS
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" bash -se <<'REMOTE'
          set -e
          cd /var/www/oneverso/current
          mkdir -p secrets AcademIA/youtube/reports
          python3 -c "import googleapiclient, google.oauth2.credentials" >/dev/null 2>&1 || pip3 install --quiet --break-system-packages google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2
          python3 scripts/youtube/apply_channel_fixes.py AcademIA/youtube/youtube_channel_fix_actions_thumb04_retry_2026-07-27.json
          REMOTE

      - name: Fetch retry report
        if: always()
        run: |
          mkdir -p AcademIA/youtube/reports
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" -o StrictHostKeyChecking=no \
            "$VPS_USER@$VPS_HOST:$REMOTE_APP/AcademIA/youtube/reports/youtube_channel_fix_results_2026-07-27.json" \
            AcademIA/youtube/reports/youtube_channel_fix_results_thumb04_retry_2026-07-27.json || true

      - name: Upload retry artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-thumb04-retry-report
          path: AcademIA/youtube/reports/youtube_channel_fix_results_thumb04_retry_2026-07-27.json
          if-no-files-found: warn
