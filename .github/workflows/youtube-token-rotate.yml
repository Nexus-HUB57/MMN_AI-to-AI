name: youtube-token-rotate

on:
  workflow_dispatch:
    inputs:
      refresh_token:
        description: 'Novo refresh token OAuth do canal no formato bruto'
        required: true
        type: string
      dispatch_thumb04_retry:
        description: 'Disparar o retry cirúrgico da thumbnail 04 após publicar o token'
        required: true
        default: true
        type: boolean

jobs:
  rotate-token:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Build authorized-user JSON from refresh token
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ inputs.refresh_token }}
        run: |
          mkdir -p .tmp
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          client_id = os.environ['YOUTUBE_CLIENT_ID'].strip()
          client_secret = os.environ['YOUTUBE_CLIENT_SECRET'].strip()
          refresh_token = os.environ['REFRESH_TOKEN'].strip()
          if not client_id or not client_secret or not refresh_token:
              raise SystemExit('missing_required_oauth_material')

          data = {
              'client_id': client_id,
              'client_secret': client_secret,
              'refresh_token': refresh_token,
              'token_uri': 'https://oauth2.googleapis.com/token',
              'type': 'authorized_user',
              'scopes': [
                  'https://www.googleapis.com/auth/youtube',
                  'https://www.googleapis.com/auth/youtube.force-ssl',
                  'https://www.googleapis.com/auth/youtube.upload'
              ]
          }
          Path('.tmp/youtube_token_rotated.json').write_text(json.dumps(data, ensure_ascii=False), encoding='utf-8')
          Path('.tmp/youtube_token_rotate_summary.json').write_text(json.dumps({
              'status': 'ready_to_publish',
              'scopes': data['scopes']
          }, ensure_ascii=False, indent=2), encoding='utf-8')
          print('authorized_user_json_ready')
          PY

      - name: Publish rotated token to repo secrets
        env:
          DEPLOY_PAT: ${{ secrets.DEPLOY_PAT }}
          GHP_FALLBACK: ${{ secrets.GHP_FALLBACK }}
        run: |
          export GH_TOKEN="${DEPLOY_PAT:-${GHP_FALLBACK:-}}"
          if [ -z "$GH_TOKEN" ]; then
            echo "No PAT available to publish rotated token" >&2
            exit 1
          fi
          gh secret set YOUTUBE_TOKEN_JSON -R Nexus-HUB57/MMN_AI-to-AI < .tmp/youtube_token_rotated.json
          gh secret set YOUTUBE_OAUTH_TOKEN_JSON -R Nexus-HUB57/MMN_AI-to-AI < .tmp/youtube_token_rotated.json
          gh secret set GOOGLE_OAUTH_TOKEN_JSON -R Nexus-HUB57/MMN_AI-to-AI < .tmp/youtube_token_rotated.json

      - name: Upload safe rotation summary
        uses: actions/upload-artifact@v4
        with:
          name: youtube-token-rotate-summary
          path: .tmp/youtube_token_rotate_summary.json
          if-no-files-found: error

      - name: Dispatch thumb04 retry workflow
        if: ${{ inputs.dispatch_thumb04_retry }}
        env:
          DEPLOY_PAT: ${{ secrets.DEPLOY_PAT }}
          GHP_FALLBACK: ${{ secrets.GHP_FALLBACK }}
        run: |
          export GH_TOKEN="${DEPLOY_PAT:-${GHP_FALLBACK:-}}"
          if [ -z "$GH_TOKEN" ]; then
            echo "No PAT available to dispatch thumb04 retry" >&2
            exit 1
          fi
          gh workflow run youtube-thumb04-retry.yml -R Nexus-HUB57/MMN_AI-to-AI
