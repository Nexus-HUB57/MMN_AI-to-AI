name: youtube-channel-fixes

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/youtube-channel-fixes.yml'
      - 'scripts/youtube/apply_channel_fixes.py'
      - 'AcademIA/youtube/youtube_channel_fix_actions_2026-07-27.json'
  workflow_dispatch:

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      YOUTUBE_OAUTH_TOKEN_JSON: ${{ secrets.YOUTUBE_OAUTH_TOKEN_JSON }}
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
      YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
      YOUTUBE_OAUTH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Apply channel fixes
        run: |
          python scripts/youtube/apply_channel_fixes.py AcademIA/youtube/youtube_channel_fix_actions_2026-07-27.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-channel-fix-report
          path: AcademIA/youtube/reports/youtube_channel_fix_results_2026-07-27.json
          if-no-files-found: warn
