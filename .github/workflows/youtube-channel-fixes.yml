name: youtube-channel-fixes

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/youtube-channel-fixes.yml'
      - 'scripts/youtube/apply_channel_fixes.py'
      - 'AcademIA/youtube/youtube_channel_fix_actions_2026-07-27.json'
  workflow_dispatch:

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      REMOTE_APP: /var/www/oneverso/current
      VPS_HOST: "143.95.213.237"
      VPS_PORT: "22022"
      VPS_USER: "root"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_GITHUB }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync fix scripts to VPS
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" \
            "mkdir -p $REMOTE_APP/scripts/youtube $REMOTE_APP/AcademIA/youtube $REMOTE_APP/AcademIA/youtube/reports"
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" -o StrictHostKeyChecking=no \
            scripts/youtube/apply_channel_fixes.py \
            "$VPS_USER@$VPS_HOST:$REMOTE_APP/scripts/youtube/apply_channel_fixes.py"
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" -o StrictHostKeyChecking=no \
            AcademIA/youtube/youtube_channel_fix_actions_2026-07-27.json \
            "$VPS_USER@$VPS_HOST:$REMOTE_APP/AcademIA/youtube/youtube_channel_fix_actions_2026-07-27.json"

      - name: Inventory YouTube credentials on VPS
        if: always()
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" bash -se <<'REMOTE'
          set -e
          cd /var/www/oneverso/current
          mkdir -p AcademIA/youtube/reports
          OUT=AcademIA/youtube/reports/youtube_credential_inventory_2026-07-27.txt
          {
            echo "# youtube credential inventory"
            echo "host=$(hostname)"
            echo "pwd=$(pwd)"
            echo "## candidate canonical paths"
            for p in \
              /var/www/oneverso/current/secrets/youtube_token.json \
              /var/www/oneverso/secrets/youtube_token.json \
              /root/secrets/youtube_token.json
            do
              if [ -f "$p" ]; then
                stat -c 'FOUND %n size=%s mtime=%y' "$p"
              else
                echo "MISSING $p"
              fi
            done
            echo "## pm2 names"
            pm2 jlist 2>/dev/null | python3 - <<'PY'
import json,sys
try:
    data=json.load(sys.stdin)
    for item in data:
        print(item.get('name',''))
except Exception:
    pass
PY
            echo "## crontab youtube lines"
            crontab -l 2>/dev/null | grep -Ei 'youtube|onda37|upload_academia' || true
            echo "## log files"
            find /var/www/oneverso/logs -maxdepth 1 -type f \( -iname 'youtube*' -o -iname '*onda37*' \) -printf '%p size=%s\n' 2>/dev/null | sort || true
            echo "## candidate files by name"
            find /var/www /root /home -maxdepth 6 -type f \( -iname '*youtube*token*.json' -o -iname '*oauth*token*.json' -o -iname '*google*oauth*.json' -o -iname '*token*.json' -o -iname '*.txt' -o -name '.env' -o -name '.env.*' \) 2>/dev/null | sort | while read -r f; do
              python3 - "$f" <<'PY'
from pathlib import Path
import json,sys
p=Path(sys.argv[1])
try:
    text=p.read_text(encoding='utf-8', errors='ignore')
except Exception:
    raise SystemExit(0)
flag=False
matches=[]
for key in ['YOUTUBE_TOKEN_JSON','YOUTUBE_OAUTH_TOKEN_JSON','GOOGLE_OAUTH_TOKEN_JSON','YOUTUBE_TOKEN','YOUTUBE_OAUTH_TOKEN']:
    if key in text:
        flag=True
        matches.append(key)
if 'refresh_token' in text and 'client_id' in text and 'client_secret' in text:
    flag=True
    matches.append('authorized_user_like')
if flag:
    try:
        st=p.stat()
        print(f"CANDIDATE {p} size={st.st_size} keys={','.join(matches)}")
    except Exception:
        print(f"CANDIDATE {p} keys={','.join(matches)}")
PY
            done
          } > "$OUT"
          REMOTE

      - name: Apply channel fixes on VPS
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" bash -se <<'REMOTE'
          set -e
          cd /var/www/oneverso/current
          mkdir -p secrets AcademIA/youtube/reports
          python3 -c "import googleapiclient, google.oauth2.credentials" >/dev/null 2>&1 || pip3 install --quiet --break-system-packages google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2
          python3 scripts/youtube/apply_channel_fixes.py AcademIA/youtube/youtube_channel_fix_actions_2026-07-27.json
          REMOTE

      - name: Fetch remote report
        if: always()
        run: |
          mkdir -p AcademIA/youtube/reports
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" -o StrictHostKeyChecking=no \
            "$VPS_USER@$VPS_HOST:$REMOTE_APP/AcademIA/youtube/reports/youtube_channel_fix_results_2026-07-27.json" \
            AcademIA/youtube/reports/youtube_channel_fix_results_2026-07-27.json || true
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" -o StrictHostKeyChecking=no \
            "$VPS_USER@$VPS_HOST:$REMOTE_APP/AcademIA/youtube/reports/youtube_credential_inventory_2026-07-27.txt" \
            AcademIA/youtube/reports/youtube_credential_inventory_2026-07-27.txt || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-channel-fix-report
          path: AcademIA/youtube/reports/youtube_channel_fix_results_2026-07-27.json
          if-no-files-found: warn
