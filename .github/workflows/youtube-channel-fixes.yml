name: youtube-channel-fixes

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/youtube-channel-fixes.yml'
      - 'scripts/youtube/apply_channel_fixes.py'
      - 'AcademIA/youtube/youtube_channel_fix_actions_2026-07-27.json'
  workflow_dispatch:

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      REMOTE_APP: /var/www/oneverso/current
      VPS_HOST: "143.95.213.237"
      VPS_PORT: "22022"
      VPS_USER: "root"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_GITHUB }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync fix scripts to VPS
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" \
            "mkdir -p $REMOTE_APP/scripts/youtube $REMOTE_APP/AcademIA/youtube $REMOTE_APP/AcademIA/youtube/reports"
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" -o StrictHostKeyChecking=no \
            scripts/youtube/apply_channel_fixes.py \
            "$VPS_USER@$VPS_HOST:$REMOTE_APP/scripts/youtube/apply_channel_fixes.py"
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" -o StrictHostKeyChecking=no \
            scripts/youtube/inventory_youtube_credentials.py \
            "$VPS_USER@$VPS_HOST:$REMOTE_APP/scripts/youtube/inventory_youtube_credentials.py"
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" -o StrictHostKeyChecking=no \
            AcademIA/youtube/youtube_channel_fix_actions_2026-07-27.json \
            "$VPS_USER@$VPS_HOST:$REMOTE_APP/AcademIA/youtube/youtube_channel_fix_actions_2026-07-27.json"

      - name: Inventory YouTube credentials on VPS
        if: always()
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" \
            "cd $REMOTE_APP && mkdir -p AcademIA/youtube/reports && python3 scripts/youtube/inventory_youtube_credentials.py"

      - name: Apply channel fixes on VPS
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_OAUTH_TOKEN_JSON: ${{ secrets.YOUTUBE_OAUTH_TOKEN_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
        run: |
          mkdir -p .tmp
          python3 - <<'PY'
          import os
          from pathlib import Path

          out = Path('.tmp/youtube_token.json')
          for name in ['YOUTUBE_TOKEN_JSON', 'YOUTUBE_OAUTH_TOKEN_JSON', 'GOOGLE_OAUTH_TOKEN_JSON']:
              value = os.environ.get(name, '').strip()
              if value:
                  out.write_text(value, encoding='utf-8')
                  print(f'token_materialized_from={name}')
                  break
          else:
              print('token_materialized_from=none')
          PY
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" \
            "mkdir -p $REMOTE_APP/secrets $REMOTE_APP/AcademIA/youtube/reports"
          if [ -f .tmp/youtube_token.json ]; then
            scp -i ~/.ssh/deploy_key -P "$VPS_PORT" -o StrictHostKeyChecking=no \
              .tmp/youtube_token.json \
              "$VPS_USER@$VPS_HOST:$REMOTE_APP/secrets/youtube_token.json"
            ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" \
              "chmod 600 $REMOTE_APP/secrets/youtube_token.json"
          fi
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" bash -se <<'REMOTE'
          set -e
          cd /var/www/oneverso/current
          mkdir -p secrets AcademIA/youtube/reports
          python3 -c "import googleapiclient, google.oauth2.credentials" >/dev/null 2>&1 || pip3 install --quiet --break-system-packages google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2
          python3 scripts/youtube/apply_channel_fixes.py AcademIA/youtube/youtube_channel_fix_actions_2026-07-27.json
          REMOTE
          rm -f .tmp/youtube_token.json

      - name: Fetch remote report
        if: always()
        run: |
          mkdir -p AcademIA/youtube/reports
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" -o StrictHostKeyChecking=no \
            "$VPS_USER@$VPS_HOST:$REMOTE_APP/AcademIA/youtube/reports/youtube_channel_fix_results_2026-07-27.json" \
            AcademIA/youtube/reports/youtube_channel_fix_results_2026-07-27.json || true
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" -o StrictHostKeyChecking=no \
            "$VPS_USER@$VPS_HOST:$REMOTE_APP/AcademIA/youtube/reports/youtube_credential_inventory_2026-07-27.txt" \
            AcademIA/youtube/reports/youtube_credential_inventory_2026-07-27.txt || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-channel-fix-report
          path: AcademIA/youtube/reports/
          if-no-files-found: warn
