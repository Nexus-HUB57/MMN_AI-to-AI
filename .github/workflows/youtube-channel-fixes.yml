name: youtube-channel-fixes

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/youtube-channel-fixes.yml'
      - 'scripts/youtube/apply_channel_fixes.py'
      - 'AcademIA/youtube/youtube_channel_fix_actions_2026-07-27.json'
  workflow_dispatch:

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      REMOTE_APP: /var/www/oneverso/current
      VPS_HOST: "143.95.213.237"
      VPS_PORT: "22022"
      VPS_USER: "root"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_GITHUB }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync fix scripts to VPS
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" \
            "mkdir -p $REMOTE_APP/scripts/youtube $REMOTE_APP/AcademIA/youtube $REMOTE_APP/AcademIA/youtube/reports"
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" -o StrictHostKeyChecking=no \
            scripts/youtube/apply_channel_fixes.py \
            "$VPS_USER@$VPS_HOST:$REMOTE_APP/scripts/youtube/apply_channel_fixes.py"
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" -o StrictHostKeyChecking=no \
            AcademIA/youtube/youtube_channel_fix_actions_2026-07-27.json \
            "$VPS_USER@$VPS_HOST:$REMOTE_APP/AcademIA/youtube/youtube_channel_fix_actions_2026-07-27.json"

      - name: Apply channel fixes on VPS
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" bash -se <<'REMOTE'
          set -e
          cd /var/www/oneverso/current
          mkdir -p secrets AcademIA/youtube/reports
          if [ -f .env ]; then set -a; . ./.env; set +a; fi
          python3 -c "import googleapiclient, google.oauth2.credentials" >/dev/null 2>&1 || pip3 install --quiet --break-system-packages google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2
          if [ ! -f secrets/youtube_token.json ]; then
            python3 - <<'PY'
from pathlib import Path
import json, os, shutil

root = Path('/var/www/oneverso/current')
out = root / 'AcademIA' / 'youtube' / 'reports' / 'youtube_token_discovery_2026-07-27.json'
secrets_dir = root / 'secrets'
secrets_dir.mkdir(parents=True, exist_ok=True)
target = secrets_dir / 'youtube_token.json'
report = {'status': 'not_found', 'source': None, 'checks': []}

def valid_authorized_user_text(text: str):
    try:
        data = json.loads(text)
    except Exception:
        return None
    if isinstance(data, dict) and data.get('type') == 'authorized_user' and data.get('refresh_token') and data.get('client_id') and data.get('client_secret'):
        return data
    return None

for env_name in ['YOUTUBE_TOKEN_JSON','YOUTUBE_OAUTH_TOKEN_JSON','GOOGLE_OAUTH_TOKEN_JSON','YOUTUBE_TOKEN','YOUTUBE_OAUTH_TOKEN']:
    value = os.environ.get(env_name, '').strip()
    if not value:
        continue
    data = valid_authorized_user_text(value)
    report['checks'].append({'kind': 'env', 'name': env_name, 'valid': bool(data)})
    if data:
        target.write_text(json.dumps(data, ensure_ascii=False), encoding='utf-8')
        report['status'] = 'materialized_from_env'
        report['source'] = env_name
        out.write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
        raise SystemExit(0)

search_roots = [Path('/var/www'), Path('/root'), Path('/home')]
patterns = ['*youtube*token*.json', '*oauth*token*.json', '*google*oauth*.json', '*token*.json', '*.txt']
seen = set()
for base in search_roots:
    if not base.exists():
        continue
    for pat in patterns:
        for p in base.rglob(pat):
            try:
                rp = str(p.resolve())
            except Exception:
                rp = str(p)
            if rp in seen:
                continue
            seen.add(rp)
            if p == target:
                continue
            try:
                if not p.is_file() or p.stat().st_size > 2_000_000:
                    continue
                text = p.read_text(encoding='utf-8', errors='ignore')
                data = valid_authorized_user_text(text)
                report['checks'].append({'kind': 'file', 'path': rp, 'valid': bool(data)})
                if data:
                    shutil.copyfile(p, target)
                    report['status'] = 'copied_from_file'
                    report['source'] = rp
                    out.write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
                    raise SystemExit(0)
            except Exception:
                continue

out.write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
raise SystemExit(0)
PY
          fi
          python3 scripts/youtube/apply_channel_fixes.py AcademIA/youtube/youtube_channel_fix_actions_2026-07-27.json
          REMOTE

      - name: Fetch remote report
        if: always()
        run: |
          mkdir -p AcademIA/youtube/reports
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" -o StrictHostKeyChecking=no \
            "$VPS_USER@$VPS_HOST:$REMOTE_APP/AcademIA/youtube/reports/youtube_channel_fix_results_2026-07-27.json" \
            AcademIA/youtube/reports/youtube_channel_fix_results_2026-07-27.json || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-channel-fix-report
          path: AcademIA/youtube/reports/youtube_channel_fix_results_2026-07-27.json
          if-no-files-found: warn
